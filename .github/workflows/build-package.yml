name: Build update package

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build (${{ matrix.os }}-${{ matrix.rid }})
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            arch: x64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set build version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm")
          $versionSafe = $version.Replace(":", "-").Replace(" ", "_")
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version_safe=$versionSafe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish desktop app (self-contained)
        shell: pwsh
        run: |
          dotnet publish .\desktop\Glance.Desktop.csproj `
            -c Release `
            -r ${{ matrix.rid }} `
            --self-contained true `
            /p:VersionStamp="${{ steps.version.outputs.version }}"

      - name: Assemble package folder
        shell: pwsh
        run: |
          $publishDir = Join-Path -Path "desktop" -ChildPath "bin/Release/net9.0/${{ matrix.rid }}/publish"
          $packageRoot = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath "package/glance"
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          Copy-Item -Path (Join-Path $publishDir "*") -Destination $packageRoot -Recurse -Force
          New-Item -ItemType Directory -Force -Path (Join-Path $packageRoot "ui/dist") | Out-Null
          Copy-Item -Path "ui/dist/*" -Destination (Join-Path $packageRoot "ui/dist") -Recurse -Force
          if (Test-Path "schema") {
            Copy-Item -Path "schema" -Destination (Join-Path $packageRoot "schema") -Recurse -Force
          }
          if (Test-Path "UPDATING.md") {
            Copy-Item -Path "UPDATING.md" -Destination (Join-Path $packageRoot "UPDATING.md") -Force
          }

      - name: Write update manifest
        shell: pwsh
        run: |
          $packageRoot = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath "package/glance"
          $manifestName = "glance.update.json"
          $manifestPath = Join-Path -Path $packageRoot -ChildPath $manifestName
          if (Test-Path $manifestPath) { Remove-Item $manifestPath -Force }
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $nullByte = [byte[]](0)
          $files = New-Object 'System.Collections.Generic.List[object]'
          foreach ($file in (Get-ChildItem -Path $packageRoot -File -Recurse | Where-Object { $_.FullName -ne $manifestPath })) {
            $relative = $file.FullName.Substring($packageRoot.Length + 1).Replace('\', '/')
            $files.Add([pscustomobject]@{ File = $file; Relative = $relative })
          }
          $files.Sort([System.Comparison[object]]{
            param($a, $b)
            [StringComparer]::OrdinalIgnoreCase.Compare($a.Relative, $b.Relative)
          })
          foreach ($item in $files) {
            $relative = $item.Relative
            $nameBytes = [System.Text.Encoding]::UTF8.GetBytes($relative)
            $sha.TransformBlock($nameBytes, 0, $nameBytes.Length, $null, 0) | Out-Null
            $sha.TransformBlock($nullByte, 0, $nullByte.Length, $null, 0) | Out-Null
            $contentBytes = [System.IO.File]::ReadAllBytes($item.File.FullName)
            $sha.TransformBlock($contentBytes, 0, $contentBytes.Length, $null, 0) | Out-Null
            $sha.TransformBlock($nullByte, 0, $nullByte.Length, $null, 0) | Out-Null
          }
          $sha.TransformFinalBlock(@(), 0, 0) | Out-Null
          $hash = [BitConverter]::ToString($sha.Hash).Replace("-", "").ToLowerInvariant()
          $payload = @{
            version = "${{ steps.version.outputs.version }}"
            algorithm = "sha256"
            hash = $hash
            format = "glance-update-1"
          }
          $payload | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 -Path $manifestPath

      - name: Create ZIP package
        shell: pwsh
        run: |
          $zipName = "glance-${{ steps.version.outputs.version_safe }}-${{ matrix.rid }}.zip"
          $zipPath = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath $zipName
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          $packageRoot = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath "package/glance"
          Compress-Archive -Path (Join-Path $packageRoot "*") -DestinationPath $zipPath

      - name: Verify update package hash
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipName = "glance-${{ steps.version.outputs.version_safe }}-${{ matrix.rid }}.zip"
          $zipPath = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath $zipName
          $packageRoot = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath "package/glance"
          $manifestPath = Join-Path -Path $packageRoot -ChildPath "glance.update.json"
          if (!(Test-Path $zipPath)) { throw "ZIP package not found at $zipPath" }
          if (!(Test-Path $manifestPath)) { throw "Update manifest not found at $manifestPath" }
          $manifest = Get-Content -Raw -Path $manifestPath | ConvertFrom-Json
          if ($manifest.algorithm -ne "sha256") { throw "Unsupported manifest algorithm: $($manifest.algorithm)" }
          $expected = ($manifest.hash ?? "").ToLowerInvariant()
          if ([string]::IsNullOrWhiteSpace($expected)) { throw "Manifest hash is empty" }

          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $items = New-Object 'System.Collections.Generic.List[object]'
            foreach ($entry in $archive.Entries) {
              if ([string]::IsNullOrWhiteSpace($entry.Name)) { continue }
              if ($entry.FullName -eq "glance.update.json") { continue }
              $relative = $entry.FullName.Replace('\', '/')
              $items.Add([pscustomobject]@{ Relative = $relative; Entry = $entry })
            }
            $items.Sort([System.Comparison[object]]{
              param($a, $b)
              [StringComparer]::OrdinalIgnoreCase.Compare($a.Relative, $b.Relative)
            })

            $sha = [System.Security.Cryptography.SHA256]::Create()
            $nullByte = [byte[]](0)
            foreach ($item in $items) {
              $nameBytes = [System.Text.Encoding]::UTF8.GetBytes($item.Relative)
              $sha.TransformBlock($nameBytes, 0, $nameBytes.Length, $null, 0) | Out-Null
              $sha.TransformBlock($nullByte, 0, 1, $null, 0) | Out-Null

              $stream = $item.Entry.Open()
              try {
                $buffer = New-Object byte[] 8192
                while (($read = $stream.Read($buffer, 0, $buffer.Length)) -gt 0) {
                  $sha.TransformBlock($buffer, 0, $read, $null, 0) | Out-Null
                }
              } finally {
                $stream.Dispose()
              }
              $sha.TransformBlock($nullByte, 0, 1, $null, 0) | Out-Null
            }
            $empty = New-Object byte[] 0
            $sha.TransformFinalBlock($empty, 0, 0) | Out-Null
          $computed = ([BitConverter]::ToString($sha.Hash).Replace("-", "").ToLowerInvariant())
          } finally {
            $archive.Dispose()
          }

          if ($computed -ne $expected) {
            Write-Host "Update manifest hash mismatch."
            Write-Host "Expected: $expected"
            Write-Host "Computed: $computed"
            throw "Update manifest hash mismatch."
          }

      - name: Publish latest build to Releases
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          removeArtifacts: true
          tag: latest
          name: Latest build
          prerelease: true
          artifacts: glance-${{ steps.version.outputs.version_safe }}-${{ matrix.rid }}.zip
          body: |
            Build: ${{ steps.version.outputs.version }} UTC
            Commit: ${{ github.sha }}
            Run: ${{ github.run_id }}
